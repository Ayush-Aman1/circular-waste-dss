# Closed-loop simulation and experiment settings (not calibration numbers; see assumptions.yaml for those).
# Seeds are disjoint from the forecaster training seeds (0-5, docs/DECISIONS.md D5).
seeds:
  test: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109]     # headline policy comparison (10 paired seeds)
  validation: [200, 201, 202, 203, 204]                        # alpha/beta ablation and any tuning, never the test seeds
  whatif: [100, 101, 102]                                      # seeds used by the what-if engine
warmup_days: 30            # baseline (2-day emptying) history before the policy takes over; forecasts need >= 14 days
eval_days: 30              # policy-controlled days per run
forecast_window_days: 22   # trailing history rows fed to the feature builder each day
router:
  ortools: {time_limit_s: 3, solution_limit: 2000}     # guided local search; solution_limit keeps runs near-deterministic
  pyvrp: {max_iterations: 1500, time_limit_s: 8}        # MaxIterations is deterministic per seed; time limit is a backstop
  tolerance_vs_other_solver: 0.05                      # cross-check: relative objective tolerance on small instances
prize:
  w_unit: inr                                          # prizes are INR/day: alpha * P(overflow) * overflow_cost + beta * recovery value
